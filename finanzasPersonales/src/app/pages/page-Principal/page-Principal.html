<div class="grid grid-cols-1 md:grid-cols-2 gap-6 h-screen p-6">
  <!-- Izquierda: Resumen Mensual -->
  <div class="overflow-auto order-3 md:order-1">
    <!-- Tabla del resumen Mensual -->
    <tabla-info-mensual />
  </div>

  <!-- Derecha: Movimientos y Cuentas -->
  <div class="flex flex-col gap-6 order-2 md:order-2">
    <!-- Movimientos -->
    <div class="flex order-1 md:order-1">
      <div class="flex-1 overflow-hidden">
        <h2 class="text-xl font-bold mb-2">Movimientos Recientes</h2>
        <table class="w-full text-center border border-gray-300">
          <thead class="bg-green-600 text-white">
            <tr>
              <th>Fecha</th>
              <th>Movimiento</th>
              <th>Descripción</th>
              <th>Medio</th>
              <th>$</th>
            </tr>
          </thead>
          <tbody>
            <!-- filas -->
          </tbody>
        </table>
      </div>
      <button
        class="btn ml-4 bg-green-500 text-white px-4 rounded"
        onclick="modalAggData.showModal()"
      >
        Agregar
      </button>
      <!-- Open the modal using ID.showModal() method -->
      <dialog id="modalAggData" class="modal">
        <div class="modal-box">
          <modal-agg-data-movimiento />
          <div class="modal-action">
            <form method="dialog">
              <!-- Al dar click se cerrara el modal y guardara los datos -->
              <button class="btn bg-primary rounded-2xl border-info">Guardar</button>
            </form>
            <form method="dialog">
              <!-- Al dar click se cerrara el mismo -->
              <button class="btn bg-warning rounded-2xl border-error">Close</button>
            </form>
          </div>
        </div>
        <form method="dialog" class="modal-backdrop">
          <!-- Al dar click fuera del modal cerrara el modal -->
          <button>close</button>
        </form>
      </dialog>
    </div>

    <!-- Cuentas y Fondos -->
    <div class="order-0 md:order-2">
      <div class="flex-1">
        <h2 class="text-xl font-bold mb-2">Cuentas y Fondos</h2>
        <table class="w-full text-center border border-gray-300">
          <thead class="bg-purple-600 text-white">
            <tr>
              <th>Fuente</th>
              <th>$</th>
            </tr>
          </thead>
          <tbody>
            <!-- filas -->
          </tbody>
        </table>
      </div>
      <button class="mt-4 bg-purple-500 text-white px-4 py-2 rounded">Agregar</button>
    </div>
  </div>
</div>
